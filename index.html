<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お月見AR体験</title>

    <!-- model-viewerを読み込む -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .ar-button {
            position: absolute;
            bottom: 50px;
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 月の3Dモデルを表示 -->
    <model-viewer
        src="moon.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="15deg"
        interaction-prompt="none">

        <button slot="ar-button" class="ar-button">
            🌕 タップしてARを開始
        </button>

    </model-viewer>

</body>
</html>
